<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>开关前后画面</title>
<link rel="stylesheet" href="tokens.css">
<style>
  body { width: 1000px; height: 500px; padding: 20px 28px; }
  .legend { font-size: 16px; color: var(--ink-2); margin-bottom: 4px; }
  svg text { font-family: inherit; }
</style></head>
<body>
<div class="legend">原神夜景，同一局、同一位置：开关 关→开→关→开→关 交替截图。<b style="color:var(--ink)">每对截图之间有多少像素明显不同</b>（越小越像）</div>
<svg id="c" width="944" height="500"></svg>
<script>
// 来源：phonefarm docs/GENSHIN_FRAME_AUDIT.md §9（knobs/evidence/11_storeop_check/storeop_check.json）
const rows = [
  ["同一段内隔 1 秒", "画面自己在动（噪声）", 3.3, 12.9, 6.4, "base", 5],
  ["开关关 vs 开（隔 6 秒）", "我们的开关", 11.4, 20.2, 15.0, "ours", 4],
  ["同一状态隔 12 秒", "画面自己在动（噪声）", 15.4, 22.0, 18.2, "base", 3],
];
const css = getComputedStyle(document.documentElement);
const C = n => css.getPropertyValue(n).trim();
const svg = document.getElementById("c"), NS = "http://www.w3.org/2000/svg";
const el = (t, a, txt) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; svg.appendChild(e); return e; };
const L = 270, R = 900, T0 = 40, band = 120, max = 25;
const x = v => L + (R - L) * v / max;
for (let t = 0; t <= max; t += 5) {
  el("line", { x1: x(t), x2: x(t), y1: T0 - 10, y2: T0 + band * rows.length - 30, stroke: C("--grid") });
  el("text", { x: x(t), y: T0 + band * rows.length - 8, "text-anchor": "middle", "font-size": 15, fill: C("--ink-3") }, t + "%");
}
rows.forEach(([name, sub, lo, hi, mean, col, n], i) => {
  const y = T0 + i * band + 30;
  el("text", { x: L - 18, y: y - 4, "text-anchor": "end", "font-size": 19, "font-weight": 600, fill: col === "ours" ? C("--ours") : C("--ink") }, name);
  el("text", { x: L - 18, y: y + 20, "text-anchor": "end", "font-size": 15, fill: C("--ink-2") }, sub + `，${n} 对`);
  el("rect", { x: x(lo), y: y - 12, width: x(hi) - x(lo), height: 24, rx: 12, fill: col === "ours" ? C("--ours-soft") : C("--base-soft"), stroke: C("--" + col), "stroke-width": 1.5 });
  el("circle", { cx: x(mean), cy: y, r: 9, fill: C("--" + col) });
  el("text", { x: x(mean), y: y - 22, "text-anchor": "middle", "font-size": 17, "font-weight": 700, fill: C("--" + col) }, "平均 " + mean + "%");
  el("text", { x: x(lo) - 8, y: y + 5, "text-anchor": "end", "font-size": 14, fill: C("--ink-3") }, lo);
  el("text", { x: x(hi) + 8, y: y + 5, "font-size": 14, fill: C("--ink-3") }, hi);
});
el("text", { x: L, y: T0 + band * rows.length + 22, "font-size": 16, fill: C("--ink"), "font-weight": 600 }, "开关前后的差别落在「画面自己动」的范围里：没看到改坏，但夜景在动，不能说逐像素相同");
</script>
</body></html>
